<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCO Rocha — Centro de Controle Operacional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --rocha:#E86820;--grafite:#686870;--title:#D85A12;--green:#00A843;--red:#d63131;--armac:#0B3FC4;
 --bg:#F5F7FB;--card:#FFF;--text:#1B2437;--muted:#6B7688;--border:#E4E8F0;--trilho:#EDF1F7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141118;--card:#1E1A22;--text:#EFE9E4;--muted:#A89F9A;--border:#3A3340;--trilho:#2A2530;--title:#FF9552;--armac:#6E93F5}}
:root[data-theme="dark"]{--bg:#141118;--card:#1E1A22;--text:#EFE9E4;--muted:#A89F9A;--border:#3A3340;--trilho:#2A2530;--title:#FF9552;--armac:#6E93F5}
html{scroll-padding-top:env(safe-area-inset-top,0px)} *,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;align-items:stretch;min-height:100vh}
aside{width:222px;flex:none;padding:calc(env(safe-area-inset-top,0px)) 10px 16px;display:flex;flex-direction:column;gap:3px;
 background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 15%,#FFE7D2 32%,#FBA05C 55%,#F0752A 76%,#E86820 100%);
 position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin}
.marca{padding:16px 12px 12px;margin-bottom:10px}
.marca .logo{background:transparent;padding:0}
.marca .logo img{width:100%;max-width:160px;height:auto;display:block}
.marca .nome{color:#3A1503;font-size:17px;font-weight:800;margin-top:9px;line-height:1.05}
.marca .nome .sub{display:block;color:#8C3708;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
.rotulo-menu{font-size:10px;font-weight:700;letter-spacing:1.6px;color:#8C3708;padding:9px 12px 5px;text-transform:uppercase}
aside button{display:block;width:100%;text-align:left;padding:8px 13px;font-size:12.5px;font-weight:700;color:#5A2A08;background:transparent;border:none;border-radius:9px;cursor:pointer;transition:transform .08s,background .15s,color .15s}
aside button:hover{color:#3A1503;background:rgba(255,255,255,.38)}
aside button.ativo{color:#3A1503;background:rgba(255,255,255,.62);box-shadow:0 1px 4px rgba(140,55,8,.28)}
.rodape-menu{margin-top:auto;padding:12px;color:#FFF;font-size:11px;line-height:1.5;text-shadow:0 1px 2px rgba(140,55,8,.4)}
main{flex:1;padding:18px 30px 50px;max-width:1220px}
.migalha{font-size:11px;font-weight:600;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.migalha b{color:var(--title);font-weight:700}
.pagina-topo h1{font-size:22px;font-weight:800;color:var(--title);margin:6px 0 2px}
.pagina-topo p{color:var(--muted);margin:0 0 18px;max-width:78ch}
.pagina{display:none}.pagina.ativa{display:block}
.subtabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;margin:0 0 16px;padding:5px;background:var(--trilho);border-radius:12px;width:max-content;max-width:100%}
.subtabs button{padding:8px 18px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;border-radius:9px;background:transparent;color:var(--muted);white-space:nowrap;font-family:inherit;transition:background .15s,color .15s,box-shadow .15s}
.subtabs button:hover{color:var(--title)} .subtabs button.on{background:var(--card);color:var(--title);box-shadow:0 1px 4px rgba(216,90,18,.22)}
.subpg{display:none}.subpg.on{display:block}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.filtros select{border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative}
.kpi b{display:block;font-size:26px;font-weight:800}
.kpi.ruim b{color:var(--red)} .kpi.bom b{color:var(--green)} .kpi.destaque b{color:var(--rocha)}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.f2{border-style:dashed}.kpi.f2 b{font-size:15px;color:var(--muted);font-weight:700;padding-top:3px}
.chip{position:absolute;top:10px;right:12px;background:var(--trilho);color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.chip.tele{color:var(--armac)} .chip.ia{color:var(--rocha)}
.painel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.painel h3{margin:0 0 4px;font-size:15px;font-weight:700}
.painel .desc{color:var(--muted);font-size:12.5px;margin:0 0 14px;max-width:78ch}
.pill{display:inline-block;background:var(--trilho);border-radius:999px;padding:1px 10px;font-size:11.5px;color:var(--muted);font-weight:600;vertical-align:1px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--border);padding:8px 10px}
td{padding:9px 10px;border-bottom:1px solid var(--border)} tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right} .cel-main{font-weight:700}
.tbl-scroll,.chart-box{overflow-x:auto}
.regras{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.regra{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--rocha);border-radius:10px;padding:14px 16px}
.regra b{font-size:14px} .regra p{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.55}
.fam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.fam-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s,transform .08s}
.fam-card:hover{box-shadow:0 3px 12px rgba(216,90,18,.18)} .fam-card:active{transform:translateY(1px)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.st-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px}
.st-card b{font-size:13.5px} .st-card .lin{color:var(--muted);margin-top:2px}
.sla-row{display:grid;grid-template-columns:100px 1fr 60px;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)}
.sla-row:last-child{border-bottom:none}
.sla-tag{font-weight:700;font-size:13.5px} .sla-tag small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.sla-barra{position:relative;height:15px;background:var(--trilho);border-radius:4px}
.sla-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--red);min-width:3px} .sla-fill.ok{background:var(--green)}
.meta-linha{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--armac);z-index:1}
.sla-h{text-align:right;font-weight:700;font-size:13px} .sla-h.ruim{color:var(--red)} .sla-h.bom{color:var(--green)}
.legenda{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pareto-wrap{max-width:720px;margin:0 auto}
#mapa-rocha{height:520px;border-radius:12px;border:1px solid var(--border);background:#CBDDEA}
.leaflet-container{font-family:'Inter',system-ui,sans-serif}
.leaflet-popup-content{font-size:12.5px;line-height:1.5} .leaflet-popup-content b{font-size:13px}
footer{color:var(--muted);font-size:12px;margin-top:30px;max-width:80ch;line-height:1.6}
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: none;
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: none;
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: none;
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;
	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;
	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;
	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

const kpi=(v,rot,cls)=>`<div class="kpi ${cls||''}"><b class="num">${v}</b><span>${rot}</span></div>`;
function dispColorR(d,meta){const x=d-meta;
 if(x>=2)return'#00A843';if(x>=0)return'#22C55E';if(x>=-1)return'#A3B520';if(x>=-2)return'#D9A50A';
 if(x>=-4)return'#E07B12';if(x>=-6)return'#D9531E';return'#C22B2B';}
function faixaR(d,meta){const pts=Math.max(0,Math.floor(meta-d));
 if(d>=meta)return{txt:'Meta ✅ sem multa',cor:'#00A843'};
 if(pts<1)return{txt:'Abaixo da meta ⚠️ (<1 p.p.)',cor:'#D9A50A'};
 return{txt:`−${Math.min(pts*0.4,5).toFixed(1).replace('.',',')}% (${pts} p.p. abaixo)`,cor:'#C22B2B'};}
let perAtual='set';
// ordenação clicável em todas as tabelas
function parseVal(s){
 s=s.trim();
 if(!s||s=='—')return -Infinity;
 const d=s.match(/^(\d{2})\/(\d{2})(?: (\d{2}):(\d{2}))?/);
 if(d)return (+d[2])*1e6+(+d[1])*1e4+(+(d[3]||0))*100+(+(d[4]||0));
 let t=s.replace(/[✓✗✅❌📡RrR\$%h ]/g,'').replace(/[^0-9.,\-]/g,'');
 if(t){if(t.includes(',')){t=t.replace(/\./g,'').replace(',','.');}
  const n=parseFloat(t); if(!isNaN(n))return n;}
 return s.toLowerCase();
}
function sortAll(root){
 (root||document).querySelectorAll('table').forEach(tb=>{
  if(tb.dataset.sortable)return; tb.dataset.sortable='1';
  tb.querySelectorAll('thead th').forEach((th,idx)=>{
   th.style.cursor='pointer'; th.title='clique para ordenar';
   th.addEventListener('click',()=>{
    const body=tb.querySelector('tbody'); if(!body)return;
    const dir=th.dataset.dir=th.dataset.dir=='asc'?'desc':'asc';
    tb.querySelectorAll('thead th').forEach(x=>{if(x!=th)x.dataset.dir='';x.innerHTML=x.innerHTML.replace(/ [▲▼]$/,'');});
    th.innerHTML=th.innerHTML.replace(/ [▲▼]$/,'')+(dir=='asc'?' ▲':' ▼');
    [...body.rows].map(r=>[parseVal(r.cells[idx]?.textContent||''),r])
     .sort((a,b)=>{const x=a[0],y=b[0];
      const c=(typeof x=='string'||typeof y=='string')?String(x).localeCompare(String(y),'pt-BR'):x-y;
      return dir=='asc'?c:-c;})
     .forEach(([,r])=>body.appendChild(r));
   });
  });
 });
}

  return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="var(--rocha)"/><text x="${x+bw/2}" y="${y-5}" font-size="11" font-weight="700" fill="var(--text)" text-anchor="middle" font-family="Inter">${v}</text>`;}).join('');

function locTabela(rows){
 const idx=Object.fromEntries((rows||[]).map(r=>[r.ativo,r]));
 const semSinal=frotaAtual().filter(f=>!idx[f.tag]);
 const chips=[...new Set(frotaAtual().map(f=>f.fam))].map(fam=>{
  const n=frotaAtual().filter(f=>f.fam==fam&&idx[f.tag]).length, t=frotaAtual().filter(f=>f.fam==fam).length;
  return `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--title)">${n}/${t} <span style="font-weight:600;color:var(--muted)">${fam}</span></span>`;}).join(' ');
 const linhas=frotaAtual().map(f=>{
  const g=idx[f.tag];
  const dt=g&&(g.location_datetime||g.snapshot_date);
  const dtTxt=dt?new Date(dt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):null;
  const fonte=g?String(g.location_source||'?').toUpperCase():'—';
  const hor=g&&g.hourmeter?Math.round(+g.hourmeter).toLocaleString('pt-BR')+' h':'—';
  const busca=[f.tag,f.fam,f.local,f.papel,fonte,g&&g.description||''].join(' ').toLowerCase();
  return `<tr data-busca="${busca}"><td><div class="cel-main">${f.tag}</div><div style="font-size:11px;color:var(--muted)">${escT(g&&g.description||f.imp||'')}</div></td>
   <td style="color:var(--muted)">${f.fam}${f.papel=='Reserva'?' <span class="pill">R</span>':''}</td>
   <td>${f.local}</td>
   <td style="font-weight:800;color:${f.ok?'var(--green)':'var(--red)'}">${f.ok?'✓':'✗'}</td>
   <td class="num">${hor}</td>
   <td class="num">${dtTxt||'<span style="background:#FDE8E8;color:var(--red);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">sem sinal</span>'}</td>
   <td>${fonte}</td></tr>`;}).join('');
 return `<div class="kpis">
  ${kpi((frotaAtual().length-semSinal.length)+' de '+frotaAtual().length,'máquinas no mapa','bom')}
  ${kpi(semSinal.length,'sem rastreamento',semSinal.length>frotaAtual().length*0.4?'ruim':'destaque')}
  ${kpi(LIVE?'60s':'—','refresh do mapa')}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px">${chips}</div>
 <div class="painel"><h3>Ativos do contrato (${frotaAtual().length})</h3>
  <p class="desc">Digite para filtrar; clique nos títulos para ordenar — a coluna Última posição denuncia quem está sem sinal.</p>
  <div class="filtros"><input id="loc-busca" placeholder="🔎 Buscar máquina, família, fonte…" style="border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-family:inherit;width:300px"
   oninput="const q=this.value.toLowerCase();document.querySelectorAll('#tb-loc tbody tr').forEach(tr=>tr.style.display=tr.dataset.busca.includes(q)?'':'none')"></div>
  <div class="tbl-scroll"><table id="tb-loc"><thead><tr><th>Máquina</th><th>Família</th><th>Local</th><th>Hoje</th><th class="num">Horímetro</th><th class="num">Última posição</th><th>Fonte</th></tr></thead><tbody>${linhas}</tbody></table></div></div>
 <div class="painel"><h3>Frota no mapa</h3>
  <div class="desc">Clique no pino para detalhes. Verde = motor ligado · cinza = desligado · azul = sem info de motor · vermelho = sem sinal há 7+ dias. ${LIVE?'Camadas no canto: Mapa / Satélite / Cinza.':'Snapshot embutido — tempo real na versão hospedada.'}</div>
  <div id="mapa-status" style="font-size:12px;color:var(--muted);margin:4px 0 8px"></div>
  <div id="mapa-rocha"></div></div>`;
}
function locPinos(rows){
 if(!locMapa)return;
 if(locLayer)locLayer.remove(); locLayer=L.layerGroup().addTo(locMapa);
 const pts=[];
 rows.forEach(g=>{
  const f=frotaAtual().find(x=>x.tag==g.ativo); if(!f||!g.latitude)return;
  const dd=diasDe(g.location_datetime||g.snapshot_date);
  const cor=dd>7?'#d63131':g.engine_on===true?'#00A843':g.engine_on===false?'#7A8699':'#0D33A8';
  const mk=L.marker(LIVE?[+g.latitude,+g.longitude]:xyArt(+g.latitude,+g.longitude),{icon:pinoGota(cor,EMOJI(f))}).addTo(locLayer);
  mk.bindPopup(`<div style="font-size:12px;line-height:1.55"><b style="color:#D85A12;font-size:13.5px">${f.tag}</b> · ${f.fam}${f.papel=='Reserva'?' (reserva)':''}<br>
   ${escT(g.description||'')}<br>
   <b>Status:</b> ${f.ok?'<span style="color:#00A843;font-weight:700">operando</span>':'<span style="color:#d63131;font-weight:700">indisponível</span>'}<br>
   <b>Motor:</b> ${g.engine_on===true?'<span style="color:#00A843;font-weight:700">Ligado</span>':g.engine_on===false?'Desligado':'—'}${g.speed!=null&&+g.speed>0?` · ${Math.round(+g.speed)} km/h`:''}<br>
   <b>Horímetro:</b> ${g.hourmeter?(+g.hourmeter).toLocaleString('pt-BR')+' h':'—'}<br>
   <b>Posição:</b> ${g.location_datetime?new Date(g.location_datetime).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):(g.snapshot_date||'—')} · fonte ${escT(String(g.location_source||'?').toUpperCase())}</div>`,{maxWidth:280});
  pts.push(LIVE?[+g.latitude,+g.longitude]:xyArt(+g.latitude,+g.longitude));
 });
 [[-25.5027,-48.5126,'Porto D. Pedro II · APPA'],[-25.507,-48.518,'Armazéns Rocha · R. João Eugênio']].forEach(([la,lo,n])=>
  L.circleMarker(LIVE?[la,lo]:xyArt(la,lo),{radius:17,color:'#E86820',weight:2,fill:false,opacity:.7}).addTo(locLayer).bindTooltip(n));
 if(pts.length&&!locInit){locMapa.fitBounds(pts,{padding:[24,24],maxZoom:LIVE?15:3});locInit=true;}
}
const LAT0=-25.560,LAT1=-25.494,LNG0=-48.560,LNG1=-48.500;
const xyArt=(la,lo)=>[700-((1-(la-LAT0)/(LAT1-LAT0))*700),(lo-LNG0)/(LNG1-LNG0)*1200];
async function locFetch(){
 try{
  const tags=frotaAtual().map(f=>f.tag).join(',');
  const r=await fetch(SUPA_URL+'/rest/v1/v_cco_frota_mapa?select=ativo,description,latitude,longitude,location_datetime,location_source,hourmeter,engine_on,speed,snapshot_date&ativo=in.('+tags+')',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
  return await r.json();
 }catch(e){return null;}
}
async function renderLoc(){
 const el=document.getElementById('pg-mapa'); if(!el)return;
 let rows;
 if(LIVE){ rows=await locFetch(); if(!rows){document.getElementById('loc-conteudo').innerHTML='<div class="painel"><p class="desc">⚠️ Sem conexão com o banco.</p></div>';return;} }
 else { rows=Object.entries(D.pos_snap).map(([tag,[la,lo,dt]])=>({ativo:tag,latitude:la,longitude:lo,location_datetime:null,snapshot_date:dt,location_source:'snapshot',hourmeter:null,engine_on:null,description:''})); }
 locRows=rows;
 document.getElementById('loc-conteudo').innerHTML=locTabela(rows);
 sortAll(document.getElementById('loc-conteudo'));
 setTimeout(()=>{
  if(typeof L==='undefined'||!document.getElementById('mapa-rocha'))return;
  if(locMapa){locMapa.remove();locMapa=null;locInit=false;}
  if(LIVE){
   locMapa=L.map('mapa-rocha',{zoomSnap:.5}).setView([-25.512,-48.518],14);
   const ruas=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:18});
   const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:18});
   const cinza=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:16});
   ruas.addTo(locMapa);
   L.control.layers({'Mapa':ruas,'Satélite':sat,'Cinza':cinza},null,{position:'topright'}).addTo(locMapa);
  } else {
   locMapa=L.map('mapa-rocha',{crs:L.CRS.Simple,minZoom:-1,maxZoom:3,zoomSnap:.5,attributionControl:false});
   L.imageOverlay(MAPA_URI,[[0,0],[700,1200]]).addTo(locMapa);
  }
  locPinos(rows);
  const s=document.getElementById('mapa-status');
  if(s)s.innerHTML=LIVE?('🟢 <b>'+rows.filter(r=>r.latitude).length+'</b> máquinas com telemetria · atualizado '+new Date().toLocaleTimeString('pt-BR').slice(0,5)+' · refresh 60s'):'📍 snapshot de '+D.gerado_em;
 },60);
}
if(LIVE) setInterval(async()=>{if(locMapa){const rows=await locFetch(); if(rows){locRows=rows;locPinos(rows);const s=document.getElementById('mapa-status');if(s)s.innerHTML='🟢 <b>'+rows.filter(r=>r.latitude).length+'</b> máquinas com telemetria · atualizado '+new Date().toLocaleTimeString('pt-BR').slice(0,5)+' · refresh 60s';}}},60000);
function abrir(id){
 PAGINAS.forEach(p=>document.getElementById('pg-'+p.id).classList.toggle('ativa',p.id===id));
 document.querySelectorAll('aside > button').forEach(b=>b.classList.toggle('ativo',b.dataset.p===id));
 const p=PAGINAS.find(p=>p.id===id);
 document.getElementById('titulo').textContent=p.nome;
 document.getElementById('subtitulo').textContent=p.sub;
 document.getElementById('migalha').innerHTML=p.grupo.toUpperCase()+' / <b>'+p.nome+'</b>';
 if(id=='resumo')renderResumo();
 if(id=='porfamilia')renderMed();
 if(id=='statusagora')renderStatus();
 if(id=='paradas')renderParadas();
 if(id=='pareto')renderParetoTab();
 if(id=='checklists')renderChk();
 if(id=='mapa')renderLoc();
 sortAll(document.getElementById('pg-'+id));
}
(function(){const tabs=document.getElementById('ct-tabs'); if(!tabs)return;
 tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));
  ['resumo','frota','metodo'].forEach(k=>document.getElementById('ct-'+k).classList.toggle('on',k==b.dataset.s));
 }));})();
document.querySelectorAll('aside > button').forEach(b=>b.addEventListener('click',()=>abrir(b.dataset.p)));
abrir('resumo');
</script>
