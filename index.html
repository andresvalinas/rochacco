<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCO Rocha — Centro de Controle Operacional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --rocha:#E86820; --grafite:#686870; --title:#D85A12;
  --green:#00A843; --red:#d63131; --armac:#0B3FC4;
  --bg:#F5F7FB; --card:#FFF; --text:#1B2437; --muted:#6B7688; --border:#E4E8F0; --trilho:#EDF1F7;
  --agua:#BFD9EC; --terra:#EDE7DC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141118; --card:#1E1A22; --text:#EFE9E4; --muted:#A89F9A;
    --border:#3A3340; --trilho:#2A2530; --title:#FF9552; --armac:#6E93F5;
    --agua:#1E3A52; --terra:#2A2622;
  }
}
:root[data-theme="dark"]{
  --bg:#141118; --card:#1E1A22; --text:#EFE9E4; --muted:#A89F9A;
  --border:#3A3340; --trilho:#2A2530; --title:#FF9552; --armac:#6E93F5;
  --agua:#1E3A52; --terra:#2A2622;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;align-items:stretch;min-height:100vh}
aside{width:222px;flex:none;padding:calc(env(safe-area-inset-top,0px)) 10px 16px;display:flex;flex-direction:column;gap:3px;
  background:linear-gradient(165deg,#3A1503 0%,#8C3708 30%,#C24E0D 55%,#E86820 82%,#F97E33 100%);
  position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin}
.marca{padding:16px 12px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:10px}
.marca .logo{background:#FFF;border-radius:9px;padding:8px 10px}
.marca .logo img{width:100%;max-width:160px;height:auto;display:block}
.marca .nome{color:#FFF;font-size:17px;font-weight:800;margin-top:9px;line-height:1.05}
.marca .nome .sub{display:block;color:#FFE3CC;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
.rotulo-menu{font-size:10px;font-weight:700;letter-spacing:1.6px;color:#FFD3B0;padding:9px 12px 5px;text-transform:uppercase}
aside button{display:block;width:100%;text-align:left;padding:9px 13px;font-size:12.5px;font-weight:600;
  color:#FFE3CC;background:transparent;border:none;border-radius:9px;cursor:pointer;
  transition:transform .08s ease, background .15s, color .15s}
aside button:hover{color:#FFF;background:rgba(255,255,255,.12)}
aside button.ativo{color:#FFF;background:rgba(255,255,255,.20);box-shadow:inset 0 1px 4px rgba(0,0,0,.25)}
aside button:focus-visible{outline:2px solid #FFF;outline-offset:-2px}
.rodape-menu{margin-top:auto;padding:12px;color:#FFD3B0;font-size:11px;line-height:1.5}
main{flex:1;padding:18px 30px 50px;max-width:1200px}
.pagina-topo h1{font-size:22px;font-weight:800;color:var(--title);margin:6px 0 2px}
.pagina-topo p{color:var(--muted);margin:0 0 18px;max-width:76ch}
.pagina{display:none}.pagina.ativa{display:block}

.subpg{display:none}.subpg.on{display:block}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.filtros select{border:1px solid var(--border);background:var(--card);color:var(--text);
  padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.faixa{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.faixa .box{flex:1 1 150px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px}
.faixa b{display:block;font-size:20px;font-weight:800}
.faixa span{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative}
.kpi b{display:block;font-size:26px;font-weight:800}
.kpi.ruim b{color:var(--red)} .kpi.bom b{color:var(--green)} .kpi.destaque b{color:var(--rocha)}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.f2{border-style:dashed}
.kpi.f2 b{font-size:15px;color:var(--muted);font-weight:700;padding-top:3px}
.chip{position:absolute;top:10px;right:12px;background:var(--trilho);color:var(--muted);
  font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.chip.tele{color:var(--armac)} .chip.ia{color:var(--rocha)}
.painel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.painel h3{margin:0 0 4px;font-size:15px;font-weight:700}
.painel .desc{color:var(--muted);font-size:12.5px;margin:0 0 14px;max-width:76ch}
.pill{display:inline-block;background:var(--trilho);border-radius:999px;padding:1px 10px;font-size:11.5px;color:var(--muted);font-weight:600;vertical-align:1px}
.sla-row{display:grid;grid-template-columns:100px 1fr 60px;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)}
.sla-row:last-child{border-bottom:none}
.sla-tag{font-weight:700;font-size:13.5px}
.sla-tag small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.sla-barra{position:relative;height:15px;background:var(--trilho);border-radius:4px}
.sla-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--red);min-width:3px}
.sla-fill.ok{background:var(--green)}
.meta-linha{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--armac);z-index:1}
.sla-h{text-align:right;font-weight:700;font-size:13px}
.sla-h.ruim{color:var(--red)} .sla-h.bom{color:var(--green)}
.legenda{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--border);padding:8px 10px}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
.cel-main{font-weight:700}
.tbl-scroll,.chart-box{overflow-x:auto}
.regras{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.regra{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--rocha);border-radius:10px;padding:14px 16px}
.regra b{font-size:14px}
.regra p{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.55}
.pareto-wrap{max-width:720px;margin:0 auto}

/* leaflet inline */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: none;
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: none;
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: none;
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;
	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;
	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;
	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;
	pointer-events: auto;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;
	color: #333;
	box-shadow: 0 3px 14px rgba(0,0,0,0.4);
	}
.leaflet-container a.leaflet-popup-close-button {
	position: absolute;
	top: 0;
	right: 0;
	border: none;
	text-align: center;
	width: 24px;
	height: 24px;
	font: 16px/24px Tahoma, Verdana, sans-serif;
	color: #757575;
	text-decoration: none;
	background: transparent;
	}
.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {
	color: #585858;
	}
.leaflet-popup-scrolled {
	overflow: auto;
	}

.leaflet-oldie .leaflet-popup-content-wrapper {
	-ms-zoom: 1;
	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

// Pareto de falhas (barras + linha acumulada)
function paretoSvg(){
 const dd=D.motivos_geral, W=700,H=300,padL=46,padR=52,padB=76,padT=16;
 const tot=dd.reduce((a,[,v])=>a+v,0), max=dd[0][1];
 const bw=(W-padL-padR)/dd.length*0.66, step=(W-padL-padR)/dd.length;
 let acc=0;
 const bars=dd.map(([n,v],i)=>{
  const x=padL+i*step+(step-bw)/2, bh=v/max*(H-padT-padB), y=H-padB-bh;
  return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="var(--rocha)"/>
   <text x="${x+bw/2}" y="${y-5}" font-size="11" font-weight="700" fill="var(--text)" text-anchor="middle" font-family="Inter">${v}</text>`;
 }).join('');
 acc=0;
 const pts=dd.map(([,v],i)=>{acc+=v;return [padL+i*step+step/2, H-padB-(acc/tot)*(H-padT-padB)];});
 const linha=`<polyline fill="none" stroke="var(--armac)" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+
  pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--armac)"/>`).join('');
 acc=0;
 const pct=dd.map(([,v],i)=>{acc+=v;return `<text x="${pts[i][0]}" y="${pts[i][1]-8}" font-size="10" fill="var(--armac)" font-weight="700" text-anchor="middle" font-family="Inter">${Math.round(acc/tot*100)}%</text>`;}).join('');
 const labels=dd.map(([n],i)=>`<text x="${padL+i*step+step/2}" y="${H-padB+14}" font-size="10" fill="var(--muted)" text-anchor="end" font-family="Inter" transform="rotate(-32 ${padL+i*step+step/2} ${H-padB+14})">${n}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="Pareto de falhas">
  <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--border)"/>${bars}${linha}${pct}${labels}</svg>`;
}

const fmtBRL=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function dispColorR(d, meta){
 const delta=d-meta;
 if(delta>=2) return '#00A843';
 if(delta>=0) return '#22C55E';
 if(delta>=-1) return '#A3B520';
 if(delta>=-2) return '#D9A50A';
 if(delta>=-4) return '#E07B12';
 if(delta>=-6) return '#D9531E';
 return '#C22B2B';
}
function faixaR(d, meta, valor){
 const pts=Math.max(0, Math.floor(meta-d));
 if(d>=meta) return {txt:'Meta ✅ sem multa',cls:'ok',cor:'#00A843'};
 if(pts<1)   return {txt:'Abaixo da meta ⚠️ (<1 p.p.)',cor:'#D9A50A'};
 const pc=Math.min(pts*0.4,5);
 return {txt:`−${pc.toFixed(1).replace('.',',')}% (${pts} p.p. abaixo)`,cor:'#C22B2B'};
}

let mapaInit=false, mapaLayer=null, mapaObj=null;
function idade(dt){const ms=Date.now()-new Date(dt.replace(' ','T')+(dt.length<17?':00':'')+'Z').getTime();const hh=ms/36e5;
 return hh<1?Math.round(hh*60)+' min':hh<48?hh.toFixed(0)+' h':Math.round(hh/24)+' dias';}
async function atualizaMapa(){
 if(!mapaObj) return;
 const tags=D.frota_oficial.map(f=>f.tag).join(',');
 let rows=[];
 try{
  const r=await fetch(SUPA_URL+'/rest/v1/v_cco_frota_mapa?select=ativo,latitude,longitude,location_datetime&ativo=in.('+tags+')',
   {headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
  rows=await r.json();
 }catch(e){ document.getElementById('mapa-status').textContent='⚠️ sem conexão com o banco — última tela mantida'; return; }
 if(mapaLayer) mapaLayer.remove();
 mapaLayer=L.layerGroup().addTo(mapaObj);
 const com=new Set();
 rows.forEach(p=>{
  const f=D.frota_oficial.find(x=>x.tag==p.ativo); if(!f||!p.latitude) return;
  com.add(p.ativo);
  const idadeH=(Date.now()-new Date(p.location_datetime).getTime())/36e5;
  const cor=!f.ok?'#d63131':idadeH>48?'#8B9AB8':'#00A843';
  L.circleMarker([+p.latitude,+p.longitude],{radius:f.papel=='Reserva'?7:9,color:'#FFF',weight:2,fillColor:cor,fillOpacity:.95})
   .addTo(mapaLayer)
   .bindPopup('<b>'+f.tag+'</b> · '+f.fam+(f.papel=='Reserva'?' <span style="color:#6B7688">(reserva)</span>':'')+
    '<br>'+f.local+' · '+(f.ok?'<span style="color:#00A843">operando</span>':'<span style="color:#d63131">indisponível</span>')+
    '<br><span style="color:#6B7688">sinal há '+idade(p.location_datetime)+'</span>');
 });
 const sem=D.frota_oficial.filter(f=>!com.has(f.tag));
 document.getElementById('mapa-status').innerHTML='🟢 <b>'+com.size+'</b> máquinas com telemetria · atualizado '+new Date().toLocaleTimeString('pt-BR').slice(0,5)+' · refresh 60s';
 document.getElementById('mapa-sem').innerHTML=sem.length?('Sem sinal de telemetria ('+sem.length+'): '+sem.map(f=>f.tag).join(' · ')):'';
}
function initMapa(){
 if(mapaInit||typeof L==='undefined'||!document.getElementById('mapa-rocha'))return;
 mapaInit=true;
 mapaObj=L.map('mapa-rocha',{zoomSnap:.5}).setView([-25.512,-48.518],14);
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Esri'}).addTo(mapaObj);
 [[-25.5027,-48.5126,'Porto D. Pedro II · APPA'],[-25.507,-48.518,'Armazéns Rocha · R. João Eugênio']]
  .forEach(([la,lo,n])=>L.circleMarker([la,lo],{radius:17,color:'#E86820',weight:2,fill:false,opacity:.7}).addTo(mapaObj).bindTooltip(n));
 atualizaMapa(); setInterval(atualizaMapa,60000);
}
